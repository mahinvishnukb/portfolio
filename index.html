<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ?v=2 busts the browser's favicon cache. Bump this number any time
         you change the icon, otherwise browsers keep serving the old one. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=3" />
    <meta name="theme-color" content="#14120f" />

    <!-- Primary SEO -->
    <title>Mahin Vishnu K B — Systems &amp; Software Engineer</title>
    <meta
      name="description"
      content="I build software, and the systems it runs on. Mostly Python and SQL, some .NET and Angular, and a fair amount of cloud and automation work. Based in Halifax, Nova Scotia. I also take photographs."
    />
    <meta name="author" content="Mahin Vishnu K B" />
    <link rel="canonical" href="https://portfolio-five-bice-30.vercel.app/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph: controls how the link previews on LinkedIn, Slack, WhatsApp, Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mahin Vishnu K B" />
    <meta property="og:url" content="https://portfolio-five-bice-30.vercel.app/" />
    <meta property="og:title" content="Mahin Vishnu K B — Systems &amp; Software Engineer" />
    <meta
      property="og:description"
      content="Applied Computer Science graduate working across systems, automation and data. Linux, shell automation, Python, SQL, Power BI, and cloud-native AI platforms."
    />
    <meta property="og:image" content="https://portfolio-five-bice-30.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mahin Vishnu K B — portfolio" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mahin Vishnu K B — Systems &amp; Software Engineer" />
    <meta
      name="twitter:description"
      content="Applied Computer Science graduate working across systems, automation and data."
    />
    <meta name="twitter:image" content="https://portfolio-five-bice-30.vercel.app/og-image.jpg" />

    <!-- Load Inter for every device so text metrics (and therefore layout) are identical on macOS, Windows, Android and iOS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Portrait is the first image painted — fetch it before the JS bundle runs -->
    <link rel="preload" as="image" href="/portrait.jpg" fetchpriority="high" />

    <!-- Structured data: helps Google show a richer result for your name -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mahin Vishnu K B",
        "jobTitle": "Systems & Software Engineer",
        "email": "mailto:mahinvishnukb@gmail.com",
        "url": "https://portfolio-five-bice-30.vercel.app/",
        "image": "https://portfolio-five-bice-30.vercel.app/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Halifax",
          "addressRegion": "Nova Scotia",
          "addressCountry": "CA"
        },
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "St. Francis Xavier University" },
          { "@type": "CollegeOrUniversity", "name": "Kongu Engineering College" }
        ],
        "knowsAbout": [
          "Linux system administration",
          "Shell scripting and automation",
          "Python",
          "SQL",
          "Power BI",
          "Cloud infrastructure",
          "Photography"
        ],
        "sameAs": [
          "https://github.com/mahinvishnukb",
          "https://www.linkedin.com/in/mahin-vishnu-k-b-b53b45222"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
